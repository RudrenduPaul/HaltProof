name: Publish npm

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
      - run: npm install -g npm@11
      - name: Validate package.json
        working-directory: npm-wrapper
        run: node -e "JSON.parse(require('fs').readFileSync('package.json', 'utf8')); console.log('package.json is valid JSON')"
      - name: Check wrapper script syntax
        working-directory: npm-wrapper
        run: node --check bin/haltproof.js
      - name: Run wrapper with missing Python CLI (expect clear failure)
        working-directory: npm-wrapper
        run: |
          set +e
          node bin/haltproof.js --help
          status=$?
          set -e
          if [ "$status" -eq 0 ]; then
            echo "expected non-zero exit when haltproof is not on PATH"
            exit 1
          fi
      - run: npm publish --access public
        working-directory: npm-wrapper
