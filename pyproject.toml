[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "haltproof-cli"
dynamic = ["version"]
description = "Cryptographically auditable emergency-shutdown orchestration for Slurm, Kubernetes, and IPMI/BMC clusters"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [
    { name = "Rudrendu Paul" },
    { name = "Sourav Nandy" },
]
keywords = [
    "incident-response",
    "cluster-management",
    "slurm",
    "kubernetes",
    "ipmi",
    "compliance-audit",
    "infrastructure-governance",
    "attestation",
    "ed25519",
    "mcp",
    "agent-tooling",
    "cli",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: System :: Clustering",
    "Topic :: System :: Systems Administration",
    "Topic :: Security",
    "Topic :: System :: Monitoring",
    "Environment :: Console",
]

dependencies = [
    "click>=8.1",
    "cryptography>=42.0",
    "mcp>=2.0.0",
    "tomli>=2.0; python_version < '3.11'",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]

[project.urls]
Homepage = "https://github.com/RudrenduPaul/HaltProof"
Repository = "https://github.com/RudrenduPaul/HaltProof"
Issues = "https://github.com/RudrenduPaul/HaltProof/issues"

[project.scripts]
haltproof = "haltproof.cli:main"

[tool.hatch.version]
path = "src/haltproof/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/haltproof"]

[tool.pytest.ini_options]
testpaths = ["tests"]
